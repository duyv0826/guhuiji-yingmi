<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="骨灰级——词源考、游戏世代刻度、认证考试。全对才算烧透。">
  <title>骨灰级 · 资深者认证所</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header class="site-head">
    <div class="site-head-inner">
      <a class="wordmark" href="#top" data-mount="wordmark"></a>
      <div class="head-right">
        <nav class="site-nav" aria-label="页面导航" data-mount="nav"></nav>
        <button class="theme-btn" type="button" data-mount="theme-btn"></button>
      </div>
    </div>
  </header>

  <main id="top">

    <section class="hero">
      <div class="hero-ash hero-ash--left" data-ash aria-hidden="true"></div>
      <div class="hero-ash hero-ash--right" data-ash aria-hidden="true"></div>
      <div class="hero-body">
        <p class="hero-kicker"><span data-mount="hero-kicker"></span></p>
        <h1 class="hero-title" data-mount="hero-title"></h1>
        <p class="hero-sub" data-mount="hero-sub"></p>
        <a class="hero-cta" data-mount="hero-cta"></a>
      </div>
    </section>

    <div class="ticker" aria-hidden="true">
      <div class="ticker-track" data-mount="ticker"></div>
    </div>

    <!-- 章节由引擎按 config.sections 动态构建 -->
    <div data-mount="sections"></div>

  </main>

  <footer class="site-foot" data-mount="footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
